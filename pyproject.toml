[project]
name = "questwright"
version = "0.1.0"
description = "Human-gated generative workflow for DND module creation"
readme = "实施方案.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "langgraph>=0.2.50",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.54",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.7",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "services"]
python_files = ["test_*.py"]
pythonpath = ["apps/api", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
